<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin - Sanae concept</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="logo.svg" alt=""><button class="btn alt sm" id="out" hidden>Déconnexion</button></header>
<div class="box" id="login"><h2>Connexion</h2>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mot de passe">
<button class="btn" id="go">Se connecter</button><p class="msg" id="lm"></p></div>
<div id="panel" hidden>
<div class="box"><h2>Ajouter un article</h2>
<input id="name" placeholder="Nom de l'article">
<select id="cat"></select>
<input id="price" type="number" min="0" placeholder="Prix en DH">
<textarea id="desc" rows="3" placeholder="Description (état, taille, marque...)"></textarea>
<input id="file" type="file" accept="image/*">
<button class="btn" id="add">Publier l'article</button><p class="msg" id="am"></p></div>
<main><h2 style="margin-bottom:14px">Mes articles</h2><div id="list"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);
$("cat").innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.fr} / ${v.ar}</option>`).join("");
async function check(){const {data:{session}}=await sb.auth.getSession();$("login").hidden=!!session;$("panel").hidden=!session;$("out").hidden=!session;if(session)load()}
$("go").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});$("lm").textContent=error?"Email ou mot de passe incorrect.":"";check()};
$("out").onclick=async()=>{await sb.auth.signOut();check()};
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("image")),"image/jpeg",.82)};img.onerror=()=>rej(new Error("image"));img.src=URL.createObjectURL(file)})}
$("add").onclick=async()=>{
  const m=$("am");m.className="msg";m.textContent="";
  if(!$("name").value.trim()||!$("price").value||!$("file").files[0]){m.textContent="Nom, prix et photo sont obligatoires.";return}
  $("add").disabled=true;m.textContent="Envoi en cours...";
  try{
    const blob=await shrink($("file").files[0]),path=`${Date.now()}.jpg`;
    let r=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});if(r.error)throw r.error;
    const url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    r=await sb.from("products").insert({name:$("name").value.trim(),category:$("cat").value,price:Number($("price").value),description:$("desc").value.trim(),image_url:url});if(r.error)throw r.error;
    ["name","price","desc","file"].forEach(i=>$(i).value="");m.className="msg ok";m.textContent="Article publié ✔";load();
  }catch(e){m.textContent="Erreur : "+(e.message||e)}
  $("add").disabled=false;
};
async function load(){
  const {data}=await sb.from("products").select("*").order("created_at",{ascending:false});
  $("list").innerHTML=(data||[]).map(p=>`<div class="row"><img src="${esc(p.image_url)}"><div class="t"><b>${esc(p.name)}</b><br>${esc(p.price)} DH ${p.sold?"· <i>vendu</i>":""}</div><button class="btn alt sm" onclick="sold('${p.id}',${!p.sold})">${p.sold?"Remettre en vente":"Marquer vendu"}</button><button class="btn sm" onclick="del('${p.id}','${esc(p.image_url)}')">Supprimer</button></div>`).join("")||"<p>Aucun article.</p>";
}
async function sold(id,v){await sb.from("products").update({sold:v}).eq("id",id);load()}
async function del(id,url){if(!confirm("Supprimer cet article ?"))return;await sb.from("products").delete().eq("id",id);const f=url.split("/products/")[1];if(f)await sb.storage.from("products").remove([f]);load()}
check();
</script></body></html>
